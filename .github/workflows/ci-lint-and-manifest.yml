name: CI - Lint & Integrity Manifest

on:
  push:
    branches: [ main ]
  pull_request: {}

permissions:
  contents: write

jobs:
  lint:
    name: Run PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
              Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          }

          $TargetPath = "./src"

          if (Test-Path $TargetPath) {
              $results = Invoke-ScriptAnalyzer -Path $TargetPath -Recurse -Severity Error, Warning
              if ($results) {
                  $results | Format-Table -AutoSize
                  $errors = $results | Where-Object { $_.Severity -eq 'Error' }
                  if ($errors) {
                      Write-Error "Se encontraron errores críticos de sintaxis en los scripts."
                      exit 1
                  }
              } else {
                  Write-Host "¡PSScriptAnalyzer no encontró problemas en la carpeta 'src'!" -ForegroundColor Green
              }
          } else {
              Write-Warning "La ruta '$TargetPath' no existe. Verifique la estructura del repositorio."
          }

  generate-derived-docs:
    name: Generate Script Catalog & Integrity Manifest
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate script catalog
        shell: pwsh
        run: ./tools/Generate-ScriptCatalog.ps1

      - name: Generate manifest.json
        shell: pwsh
        run: |
          ./src/security/Confirm-ScriptIntegrity.ps1 `
            -Action Generate `
            -SourcePath "$PWD" `
            -ManifestPath "$PWD/manifest.json"

      - name: Commit derived docs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f manifest.json
          git add docs/reference/script-catalog.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): actualizar manifest.json y script-catalog.md [skip ci]"
            git push
          else
            echo "Sin cambios en artefactos derivados."
          fi
          